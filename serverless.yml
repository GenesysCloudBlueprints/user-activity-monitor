service: user-activity-monitor

frameworkVersion: "3"

plugins:
  - serverless-plugin-log-retention

# Variables
custom:
  genesysCloud:
    # Genesys Cloud details https://help.genesys.cloud/articles/configure-the-amazon-eventbridge-integration/
    genesysCloudOrgId: YOUR_GENESYS_ORG_ID_HERE
    genesysCloudEventSourceSuffix: user-activity-monitor
    # Partner event source https://developer.genesys.cloud/notificationsalerts/notifications/event-bridge#manage-your-amazon-eventbridge-partner-source
    eventSource: "aws.partner/genesys.com/cloud/${self:custom.genesysCloud.genesysCloudOrgId}/${self:custom.genesysCloud.genesysCloudEventSourceSuffix}"
    # Client Credentials OAuth Client ID (for backend Lambda functions)
    clientCredentialsClientId: YOUR_BACKEND_CLIENT_ID_HERE
    # Code Authorization OAuth Client ID (for frontend user login)
    codeAuthClientId: YOUR_FRONTEND_CLIENT_ID_HERE

  # serverless-plugin-log-retention
  logRetentionInDays: 30

provider:
  name: aws
  runtime: provided.al2023
  region: us-east-1
  stage: ${opt:stage, 'dev'}
  memorySize: 512
  timeout: 30
  apiGateway:
    stage: deploy
  environment:
    DYNAMODB_TABLE: ${self:service}-${self:provider.stage}
    DYNAMODB_GSI_LIST: ${self:service}-${self:provider.stage}-list-gsi
    GENESYS_API_DOMAIN: YOUR_GENESYS_DOMAIN_HERE  # e.g., mypurecloud.com, mypurecloud.ie, mypurecloud.com.au, etc.
    GENESYS_CREDENTIALS_SECRET_NAME: user-activity-monitor-client-credentials
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:Query
            - dynamodb:Scan
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
          Resource:
            - "arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.environment.DYNAMODB_TABLE}"
            - "arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.environment.DYNAMODB_TABLE}/index/${self:provider.environment.DYNAMODB_GSI_LIST}"
        - Effect: Allow
          Action:
            - logs:CreateLogGroup
            - logs:CreateLogStream
            - logs:PutLogEvents
          Resource: "*"
        - Effect: Allow
          Action:
            - secretsmanager:GetSecretValue
          Resource:
            - "arn:aws:secretsmanager:${self:provider.region}:*:secret:${self:provider.environment.GENESYS_CREDENTIALS_SECRET_NAME}-*"
  eventBridge:
    useCloudFormation: true

package:
  individually: true
  exclude:
    - "**/*"

functions:
  MonitorUserActivity:
    handler: bootstrap
    package:
      artifact:
        - lambda/dist/monitorlambdafunction/monitorlambdafunction.zip
    events:
      - eventBridge:
          eventBus: !GetAtt UserMonitorEventBus.Name
          pattern:
            source:
              - ${self:custom.genesysCloud.eventSource}
    environment:
      DYNAMODB_TABLE: ${self:provider.environment.DYNAMODB_TABLE}
      DYNAMODB_GSI_LIST: ${self:provider.environment.DYNAMODB_GSI_LIST}
      GENESYS_API_DOMAIN: ${self:provider.environment.GENESYS_API_DOMAIN}
    tags:
      Service: ${self:service}
      Environment: ${self:provider.stage}

  ActivityReaper:
    handler: bootstrap
    package:
      artifact:
        - lambda/dist/reaperlambdafunction/reaperlambdafunction.zip
    events:
      - schedule:
          rate: rate(5 minutes)
          enabled: true
    environment:
      DYNAMODB_TABLE: ${self:provider.environment.DYNAMODB_TABLE}
      DYNAMODB_GSI_LIST: ${self:provider.environment.DYNAMODB_GSI_LIST}
      GENESYS_API_DOMAIN: ${self:provider.environment.GENESYS_API_DOMAIN}
    tags:
      Service: ${self:service}
      Environment: ${self:provider.stage}

  GenerateReport:
    handler: bootstrap
    package:
      artifact:
        - lambda/dist/reportlambdafunction/reportlambdafunction.zip
    events:
      - http:
          path: /report
          method: GET
          cors: true
      - http:
          path: /report/data
          method: GET
          cors: true
    environment:
      DYNAMODB_TABLE: ${self:provider.environment.DYNAMODB_TABLE}
      DYNAMODB_GSI_LIST: ${self:provider.environment.DYNAMODB_GSI_LIST}
      EXPECTED_ORGANIZATION_ID: ${self:custom.genesysCloud.genesysCloudOrgId}
      CODE_AUTH_CLIENT_ID: ${self:custom.genesysCloud.codeAuthClientId}
      GENESYS_API_DOMAIN: ${self:provider.environment.GENESYS_API_DOMAIN}
    tags:
      Service: ${self:service}
      Environment: ${self:provider.stage}
      Function: GenerateReport

  OAuthCallback:
    handler: bootstrap
    package:
      artifact:
        - lambda/dist/callbacklambdafunction/callbacklambdafunction.zip
    events:
      - http:
          path: /callback
          method: GET
          cors: true
    environment:
      CODE_AUTH_CLIENT_ID: ${self:custom.genesysCloud.codeAuthClientId}
      GENESYS_API_DOMAIN: ${self:provider.environment.GENESYS_API_DOMAIN}
    tags:
      Service: ${self:service}
      Environment: ${self:provider.stage}
      Function: OAuthCallback

resources:
  Resources:
    UserActivityTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.DYNAMODB_TABLE}
        BillingMode: PAY_PER_REQUEST
        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: true
        AttributeDefinitions:
          - AttributeName: _pk
            AttributeType: S
          - AttributeName: _sk
            AttributeType: S
          - AttributeName: _gsi_list_pk
            AttributeType: S
          - AttributeName: _gsi_list_sk
            AttributeType: S
        KeySchema:
          - AttributeName: _pk
            KeyType: HASH
          - AttributeName: _sk
            KeyType: RANGE
        GlobalSecondaryIndexes:
          - IndexName: ${self:provider.environment.DYNAMODB_GSI_LIST}
            KeySchema:
              - AttributeName: _gsi_list_pk
                KeyType: HASH
              - AttributeName: _gsi_list_sk
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
        Tags:
          - Key: Service
            Value: ${self:service}
          - Key: Environment
            Value: ${self:provider.stage}
        TimeToLiveSpecification:
          AttributeName: _ttl
          Enabled: true

    UserMonitorEventBus:
      Type: AWS::Events::EventBus
      Properties:
        Name: ${self:custom.genesysCloud.eventSource}
        EventSourceName: ${self:custom.genesysCloud.eventSource}

    CloudFormationCreatedSecret:
      Type: "AWS::SecretsManager::Secret"
      Properties:
        Name: ${self:provider.environment.GENESYS_CREDENTIALS_SECRET_NAME}
        Description: Simple secret created by AWS CloudFormation
        # SecretString seeds the secret with placeholders -- DO NOT PUT YOUR SECRETS HERE! Set them via the AWS console
        # https://us-east-1.console.aws.amazon.com/secretsmanager/secret?name=user-activity-monitor-client-credentials&region=us-east-1
        SecretString: |
          {
            "clientId": "YOUR_CLIENT_ID",
            "clientSecret": "YOUR_CLIENT_SECRET"
          }
        Tags:
          - Key: Service
            Value: ${self:service}
          - Key: Environment
            Value: ${self:provider.stage}
